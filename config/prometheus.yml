global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'sample_monitoring'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8081']

  - job_name: 'postgres'
    static_configs:
      - targets: [ 'postgres-exporter:9187' ]

  - job_name: 'kafka'
    static_configs:
      - targets: [ 'kafka-exporter:9308' ]
    scrape_interval: 10s

  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]