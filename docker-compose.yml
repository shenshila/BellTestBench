version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    ports:
      - "2181:2181"
    env_file:
      - kafka.env
    networks:
      - network

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    env_file:
      - kafka.env
    networks:
      - network

networks:
  network:
    driver: bridge